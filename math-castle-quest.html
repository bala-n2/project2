<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Solve addition riddles and help your adventurer reach the castle.">
	<title>Math Castle Quest | Common Ground</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #252b32;
			--muted: #68747b;
			--paper: #f4f2ea;
			--cream: #fffdf8;
			--coral: #ef7557;
			--coral-deep: #c55038;
			--lime: #e5dc70;
			--sky: #a9d9e8;
			--green: #6d9b5e;
			--line: rgba(37, 43, 50, .16);
			--mono: "DM Mono", monospace;
			--sans: "Manrope", sans-serif;
		}
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
		a { color: inherit; text-decoration: none; }
		button { font: inherit; }
		.shell { max-width: 1100px; margin: 0 auto; padding: 0 30px; }
		.nav { display: flex; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 1px solid var(--line); }
		.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; }
		.brand-mark { width: 22px; height: 22px; border-radius: 50% 50% 50% 8px; background: var(--coral); transform: rotate(-18deg); }
		.home-link { color: var(--muted); font-size: .78rem; font-weight: 700; }
		.home-link:hover { color: var(--ink); }
		main { padding-top: 26px; padding-bottom: 44px; }
		.adventure { overflow: hidden; border: 1px solid var(--line); background: var(--cream); box-shadow: 0 15px 42px rgba(37, 43, 50, .07); }
		.game-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px 24px; }
		h1 { margin: 0; font-size: 1.18rem; line-height: 1.2; }
		.progress-wrap { display: flex; align-items: center; gap: 12px; }
		.progress-label { color: var(--muted); font-family: var(--mono); font-size: .65rem; text-transform: uppercase; white-space: nowrap; }
		progress { width: 142px; height: 9px; overflow: hidden; appearance: none; border: 0; border-radius: 6px; background: #e9e7de; }
		progress::-webkit-progress-bar { border-radius: 6px; background: #e9e7de; }
		progress::-webkit-progress-value { border-radius: 6px; background: var(--green); transition: width .4s ease; }
		progress::-moz-progress-bar { border-radius: 6px; background: var(--green); }
		.world { position: relative; overflow: hidden; aspect-ratio: 2.08 / 1; background: var(--sky); }
		.world svg { display: block; width: 100%; height: 100%; }
		#hero-character { transition: transform .85s cubic-bezier(.2, .75, .25, 1); }
		#monster { transition: opacity .5s ease; }
		#monster.monster-gone { opacity: 0; }
		#hero-character .body-bob { transform-box: fill-box; transform-origin: center bottom; }
		#hero-character.walking .body-bob { animation: hop .18s ease-in-out infinite alternate; }
		#hero-character .leg-left, #hero-character .leg-right { transform-box: fill-box; transform-origin: top center; }
		#hero-character.walking .leg-left { animation: step-left .18s ease-in-out infinite alternate; }
		#hero-character.walking .leg-right { animation: step-right .18s ease-in-out infinite alternate; }
		.castle-flag { transform-box: fill-box; transform-origin: left center; }
		.castle-won .castle-flag { animation: flag-wave .45s ease-in-out infinite alternate; }
		.monster-badge { transition: opacity .4s ease, transform .4s ease; }
		.monster-badge.monster-gone { opacity: 0; transform: scale(.6); }
		.challenge { display: grid; grid-template-columns: minmax(210px, .8fr) minmax(300px, 1.2fr); align-items: center; gap: 28px; padding: 25px 30px 27px; border-top: 1px solid var(--line); }
		.riddle-intro { display: flex; align-items: center; gap: 15px; }
		.monster-badge { display: grid; flex: 0 0 58px; width: 58px; aspect-ratio: 1; place-items: center; border: 1px solid var(--ink); border-radius: 50%; background: #bd8bb8; font-size: 1.9rem; }
		.riddle-label { margin: 0 0 5px; color: var(--coral-deep); font-family: var(--mono); font-size: .64rem; text-transform: uppercase; }
		.riddle-copy { margin: 0; font-size: .94rem; font-weight: 700; line-height: 1.4; }
		.question-area { min-width: 0; }
		.equation { margin: 0 0 14px; font-family: var(--mono); font-size: 2rem; font-weight: 500; text-align: center; }
		.answer-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
		.answer-button { min-height: 50px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: white; font-family: var(--mono); font-size: 1.05rem; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
		.answer-button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--ink); background: var(--lime); }
		.answer-button:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		.answer-button:disabled { cursor: default; }
		.answer-button.correct { border-color: var(--green); background: #d9edcf; }
		.answer-button.wrong { border-color: var(--coral-deep); background: #f8d4c8; }
		.game-status { min-height: 24px; margin: 12px 0 0; color: var(--muted); font-size: .79rem; font-weight: 700; text-align: center; }
		.game-status[data-result="correct"] { color: #47703d; }
		.game-status[data-result="wrong"] { color: var(--coral-deep); }
		.game-actions { display: flex; justify-content: center; padding: 0 24px 22px; }
		.restart { min-height: 42px; padding: 0 17px; border: 1px solid var(--ink); border-radius: 3px; color: var(--cream); background: var(--ink); font-size: .78rem; font-weight: 700; cursor: pointer; }
		.restart:hover { border-color: var(--coral-deep); background: var(--coral-deep); }
		[hidden] { display: none !important; }
		.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
		@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-5px); } }
		@keyframes step-left { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
		@keyframes step-right { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
		@keyframes flag-wave { from { transform: skewY(-9deg); } to { transform: skewY(9deg); } }
		@media (max-width: 680px) {
			.shell { padding-right: 16px; padding-left: 16px; }
			.nav { min-height: 66px; }
			main { padding-top: 18px; }
			.game-top { align-items: flex-start; flex-direction: column; gap: 12px; padding: 16px 18px; }
			.progress-wrap { width: 100%; justify-content: space-between; }
			progress { flex: 1; max-width: 190px; }
			.world { min-height: 205px; aspect-ratio: 1.65 / 1; }
			.challenge { grid-template-columns: 1fr; gap: 18px; padding: 20px 18px; }
			.riddle-intro { justify-content: center; text-align: left; }
			.equation { font-size: 1.8rem; }
		}
		@media (max-width: 380px) {
			.world { min-height: 180px; }
			.answer-options { gap: 7px; }
			.answer-button { min-height: 46px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<header class="shell">
		<nav class="nav" aria-label="Main navigation">
			<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>common ground</a>
			<a class="home-link" href="index.html">Back to game shelf</a>
		</nav>
	</header>
	<main class="shell">
		<section class="adventure" aria-labelledby="game-title">
			<div class="game-top">
				<h1 id="game-title">Math Castle Quest</h1>
				<div class="progress-wrap">
					<span class="progress-label" id="progress-label">Castle trail · 0 / 5</span>
					<label class="sr-only" for="adventure-progress">Adventure progress</label>
					<progress id="adventure-progress" max="5" value="0">0 of 5</progress>
				</div>
			</div>
			<div class="world">
				<svg id="adventure-world" viewBox="0 0 900 430" role="img" aria-labelledby="world-title world-description" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
					<title id="world-title">A path through the hills to a castle</title>
					<desc id="world-description">A young adventurer faces a friendly monster on the path to a castle.</desc>
					<defs>
						<linearGradient id="sky-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ed5e8"/><stop offset="1" stop-color="#d9f0e8"/></linearGradient>
						<linearGradient id="hill-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#98bd70"/><stop offset="1" stop-color="#6d9b5e"/></linearGradient>
					</defs>
					<rect width="900" height="430" fill="url(#sky-gradient)"/>
					<circle cx="128" cy="95" r="39" fill="#f7df78"/>
					<g fill="#fffdf8" opacity=".9">
						<path d="M275 104c0-15 12-27 27-27 11 0 20 6 25 15 4-3 9-5 15-5 15 0 27 12 27 27H275z"/>
						<path d="M565 76c0-12 10-22 22-22 9 0 17 5 21 13 4-3 8-4 13-4 12 0 22 10 22 22H565z"/>
					</g>
					<path d="M0 278c104-87 207-74 314-10 109-102 204-92 303-25 91-76 185-70 283 4v183H0z" fill="#b8d79a"/>
					<path d="M0 327c123-83 251-55 364-8 137-93 251-83 354-21 70-38 127-37 182-12v144H0z" fill="url(#hill-gradient)"/>
					<path d="M0 377c149-45 288-22 410-18 163-29 322-34 490-7v78H0z" fill="#5e8951"/>
					<path d="M50 376c176-42 286-27 415-21s249-21 384-6" fill="none" stroke="#ead49a" stroke-width="28" stroke-linecap="round" opacity=".95"/>
					<path d="M50 376c176-42 286-27 415-21s249-21 384-6" fill="none" stroke="#fff0c5" stroke-width="2" stroke-dasharray="4 14" stroke-linecap="round"/>
					<g id="castle">
						<rect x="713" y="188" width="138" height="151" fill="#f6d99a" stroke="#725d4b" stroke-width="4"/>
						<path d="M704 191v-49h30v17h20v-17h30v49M780 191v-49h30v17h20v-17h30v49" fill="#df9568" stroke="#725d4b" stroke-width="4" stroke-linejoin="round"/>
						<path d="M735 142v-36h48v36M811 142v-36h48v36" fill="#f6d99a" stroke="#725d4b" stroke-width="4"/>
						<path d="M744 106h31v-21l-31 10zM820 106h31V85l-31 10z" fill="#ef7557" stroke="#725d4b" stroke-width="3" stroke-linejoin="round"/>
						<path d="M764 339v-62a19 19 0 0 1 38 0v62" fill="#76564c" stroke="#725d4b" stroke-width="4"/>
						<rect x="729" y="218" width="25" height="33" rx="12" fill="#a9d9e8" stroke="#725d4b" stroke-width="3"/>
						<rect x="810" y="218" width="25" height="33" rx="12" fill="#a9d9e8" stroke="#725d4b" stroke-width="3"/>
						<g class="castle-flag"><path d="M783 87V52" stroke="#725d4b" stroke-width="4"/><path d="M785 54h42l-11 12 11 12h-42z" fill="#ef7557" stroke="#725d4b" stroke-width="3" stroke-linejoin="round"/></g>
					</g>
					<g id="monster" transform="translate(438 267)">
						<path d="M21 36 7 21l2 26M66 34l13-16-1 29" fill="#bd8bb8" stroke="#463b50" stroke-width="4" stroke-linejoin="round"/>
						<path d="M16 67c-8-24-2-53 26-56 29-4 41 22 34 54l-5 38H20z" fill="#bd8bb8" stroke="#463b50" stroke-width="4"/>
						<path d="M20 58 3 72M74 58l17 12" fill="none" stroke="#463b50" stroke-width="9" stroke-linecap="round"/>
						<ellipse cx="32" cy="42" rx="7" ry="10" fill="#fffdf8"/><ellipse cx="59" cy="42" rx="7" ry="10" fill="#fffdf8"/>
						<circle cx="34" cy="44" r="3.5" fill="#252b32"/><circle cx="57" cy="44" r="3.5" fill="#252b32"/>
						<path d="M34 68q9 9 20 0" fill="none" stroke="#463b50" stroke-width="4" stroke-linecap="round"/>
						<path d="M28 103v13m30-13v13" stroke="#463b50" stroke-width="8" stroke-linecap="round"/>
					</g>
					<g id="hero-character" transform="translate(100 0)">
						<g class="body-bob">
							<path class="leg-left" d="M33 360 27 387" fill="none" stroke="#37475b" stroke-width="10" stroke-linecap="round"/>
							<path class="leg-right" d="M52 360 59 387" fill="none" stroke="#37475b" stroke-width="10" stroke-linecap="round"/>
							<path d="M18 326q23-15 49 0l-5 39H23z" fill="#ef7557" stroke="#37475b" stroke-width="4" stroke-linejoin="round"/>
							<path d="M21 333 6 351m60-18 13 15" fill="none" stroke="#37475b" stroke-width="8" stroke-linecap="round"/>
							<path d="M24 392h-9m52 0h-9" stroke="#eac36a" stroke-width="8" stroke-linecap="round"/>
							<circle cx="43" cy="302" r="22" fill="#e9b78e" stroke="#37475b" stroke-width="4"/>
							<path d="M22 300q-2-26 23-27 20 1 20 23l-12-9-13 6-16-2" fill="#5b453c"/>
							<circle cx="36" cy="304" r="2.5" fill="#252b32"/><circle cx="50" cy="304" r="2.5" fill="#252b32"/>
							<path d="M38 314q5 4 10 0" fill="none" stroke="#a6564e" stroke-width="2" stroke-linecap="round"/>
						</g>
					</g>
					<g fill="#f7df78"><path d="m206 203 5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z"/><path d="m658 91 4 9 10 1-8 6 2 10-8-5-8 5 2-10-8-6 10-1z"/></g>
				</svg>
			</div>
			<section class="challenge" aria-labelledby="question-title">
				<div class="riddle-intro">
					<span class="monster-badge" aria-hidden="true">👾</span>
					<div><p class="riddle-label">Monster's riddle</p><p class="riddle-copy" id="question-title">Solve it to keep going!</p></div>
				</div>
				<div class="question-area">
					<p class="equation" id="equation">7 + 8 = ?</p>
					<div class="answer-options" id="answer-options" aria-label="Choose your answer"></div>
					<p class="game-status" id="game-status" role="status" aria-live="polite">Pick the right answer to continue.</p>
				</div>
			</section>
			<div class="game-actions"><button class="restart" id="restart-button" type="button" hidden>Try again</button></div>
		</section>
	</main>
	<script>
		const totalSteps = 5;
		const optionsElement = document.querySelector("#answer-options");
		const equationElement = document.querySelector("#equation");
		const statusElement = document.querySelector("#game-status");
		const progressElement = document.querySelector("#adventure-progress");
		const progressLabel = document.querySelector("#progress-label");	
		const character = document.querySelector("#hero-character");
		const monster = document.querySelector("#monster");
		const monsterBadge = document.querySelector(".monster-badge");
		const riddleLabel = document.querySelector(".riddle-label");
		const riddleCopy = document.querySelector("#question-title");
		const world = document.querySelector("#adventure-world");
		const restartButton = document.querySelector("#restart-button");
		let step = 0;
		let correctAnswer;
		let finished = false;
		let moving = false;

		function makeOptions(answer) {
			const options = new Set([answer, answer - 1, answer + 2]);
			const shuffled = Array.from(options);
			for (let index = shuffled.length - 1; index > 0; index -= 1) {
				const swapIndex = Math.floor(Math.random() * (index + 1));
				[shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
			}
			return shuffled;
		}

		function showQuestion() {
			const firstNumber = Math.floor(Math.random() * 9) + 2;
			const secondNumber = Math.floor(Math.random() * 9) + 2;
			correctAnswer = firstNumber + secondNumber;
			equationElement.textContent = `${firstNumber} + ${secondNumber} = ?`;

			optionsElement.replaceChildren();
			makeOptions(correctAnswer).forEach((answer) => {
				const button = document.createElement("button");
				button.className = "answer-button";
				button.type = "button";
				button.textContent = answer;
				button.addEventListener("click", () => chooseAnswer(answer, button));
				optionsElement.append(button);
			});
			statusElement.textContent = "Pick the right answer to continue.";
			statusElement.dataset.result = "";
		}

		function updateProgress() {
			progressElement.value = step;
			progressLabel.textContent = `Castle trail · ${step} / ${totalSteps}`;
		}

		function finishGame(message, result) {
			finished = true;
			moving = false;
			statusElement.textContent = message;
			statusElement.dataset.result = result;
			optionsElement.querySelectorAll("button").forEach((button) => { button.disabled = true; });
			restartButton.hidden = false;
		}

		function chooseAnswer(answer, selectedButton) {
			if (finished || moving) return;
			if (answer !== correctAnswer) {
				selectedButton.classList.add("wrong");
				finishGame(`Oh no! The answer was ${correctAnswer}. The adventure is over.`, "wrong");
				return;
			}

			selectedButton.classList.add("correct");
			optionsElement.querySelectorAll("button").forEach((button) => { button.disabled = true; });
			step += 1;
			updateProgress();
			character.setAttribute("transform", `translate(${100 + step * 108} 0)`);
			character.classList.add("walking");
			moving = true;

			if (step === totalSteps) {
				world.classList.add("castle-won");
				monster.classList.add("monster-gone");
				monsterBadge.classList.add("monster-gone");
				riddleLabel.textContent = "A parting message";
				riddleCopy.textContent = "Good job! You made it to the castle!";
				finishGame("You made it to the castle! Brilliant adventure!", "correct");
				return;
			}

			statusElement.textContent = "That's right! You're one step closer to the castle.";
			statusElement.dataset.result = "correct";
			window.setTimeout(() => {
				character.classList.remove("walking");
				moving = false;
				showQuestion();
			}, 850);
		}

		function startAdventure() {
			step = 0;
			finished = false;
			moving = false;
			character.setAttribute("transform", "translate(100 0)");
			character.classList.remove("walking");
			monster.classList.remove("monster-gone");
			monsterBadge.classList.remove("monster-gone");
			riddleLabel.textContent = "Monster's riddle";
			riddleCopy.textContent = "Solve it to keep going!";
			world.classList.remove("castle-won");
			restartButton.hidden = true;
			updateProgress();
			showQuestion();
		}

		restartButton.addEventListener("click", startAdventure);
		startAdventure();
	</script>
</body>
</html>
