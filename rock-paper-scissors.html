<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Play rock paper scissors against the computer.">
	<title>Rock Paper Scissors | Common Ground</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #20221f;
			--muted: #6c6f68;
			--paper: #f6f3ed;
			--cream: #fffdf8;
			--coral: #ed6f52;
			--coral-deep: #c94e39;
			--lime: #d8e889;
			--line: rgba(32, 34, 31, .14);
			--mono: "DM Mono", monospace;
			--sans: "Manrope", sans-serif;
		}
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
		a { color: inherit; text-decoration: none; }
		button { font: inherit; }
		.shell { max-width: 1000px; margin: 0 auto; padding: 0 32px; }
		.nav { display: flex; align-items: center; justify-content: space-between; min-height: 88px; border-bottom: 1px solid var(--line); }
		.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; }
		.brand-mark { width: 24px; height: 24px; border-radius: 50% 50% 50% 8px; background: var(--coral); transform: rotate(-18deg); }
		.home-link { color: var(--muted); font-size: .82rem; font-weight: 700; }
		.home-link:hover { color: var(--ink); }
		main { display: grid; min-height: calc(100vh - 89px); place-items: center; padding: 42px 0 64px; }
		.arena { width: min(100%, 720px); padding: 38px 42px; border: 1px solid var(--line); background: var(--cream); animation: arrive .55s ease both; }
		.eyebrow { color: var(--coral-deep); font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
		h1 { margin: 14px 0 8px; font-size: clamp(2.5rem, 7vw, 3.8rem); line-height: 1; letter-spacing: -.07em; }
		.intro { margin: 0; color: var(--muted); line-height: 1.6; }
		.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin: 30px 0 20px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
		.score { display: flex; align-items: center; gap: 10px; }
		.score:last-child { justify-content: flex-end; }
		.score-label { color: var(--muted); font-size: .74rem; font-weight: 700; }
		.score-value { font-family: var(--mono); font-size: 1.3rem; }
		.round-count { color: var(--muted); font-family: var(--mono); font-size: .65rem; text-align: center; text-transform: uppercase; }
		.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 18px 0 24px; }
		.contestant { display: grid; justify-items: center; gap: 12px; }
		.contestant-name { color: var(--muted); font-family: var(--mono); font-size: .65rem; text-transform: uppercase; }
		.choice-display { display: grid; width: 112px; aspect-ratio: 1; place-items: center; border: 1px solid var(--ink); border-radius: 50%; background: var(--lime); font-size: 3rem; }
		.contestant:last-child .choice-display { background: #f5c1ae; }
		.choice-display span { display: block; line-height: 1; }
		.versus { color: var(--muted); font-family: var(--mono); font-size: .7rem; }
		.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
		.choice-button { display: grid; min-height: 88px; justify-items: center; align-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); background: white; cursor: pointer; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
		.choice-button:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--ink); background: var(--lime); }
		.choice-button:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		.choice-button:disabled { cursor: wait; opacity: .68; }
		.choice-symbol { font-size: 1.8rem; line-height: 1; }
		.choice-name { font-size: .76rem; font-weight: 700; }
		.status { min-height: 28px; margin: 18px 0 0; color: var(--coral-deep); font-size: .92rem; font-weight: 700; text-align: center; }
		.controls { display: flex; justify-content: center; margin-top: 18px; }
		.reset { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); background: transparent; font-size: .76rem; font-weight: 700; cursor: pointer; }
		.reset:hover { border-color: var(--ink); }
		.is-playing { animation: shake .55s ease-in-out; }
		.is-revealed { animation: reveal .35s ease-out both; }
		@keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-8px) rotate(-8deg); } 40% { transform: translateX(8px) rotate(8deg); } 60% { transform: translateX(-5px) rotate(-5deg); } 80% { transform: translateX(5px) rotate(5deg); } }
		@keyframes reveal { from { opacity: .25; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
		@media (max-width: 600px) {
			.shell { padding-right: 20px; padding-left: 20px; }
			.nav { min-height: 72px; }
			.arena { padding: 30px 22px; }
			.scoreboard { gap: 10px; }
			.score { gap: 7px; }
			.score-label { font-size: .68rem; }
			.choice-display { width: 86px; font-size: 2.5rem; }
			.duel { gap: 10px; }
			.choice-button { min-height: 78px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body>
	<header class="shell">
		<nav class="nav" aria-label="Main navigation">
			<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>common ground</a>
			<a class="home-link" href="index.html">Back to home</a>
		</nav>
	</header>
	<main class="shell">
		<section class="arena" aria-labelledby="game-title">
			<div class="eyebrow">A quick match</div>
			<h1 id="game-title">Rock paper scissors.</h1>
			<p class="intro">Choose your move. The computer will make a random choice.</p>
			<div class="scoreboard" aria-label="Match score">
				<div class="score"><span class="score-label">You</span><strong class="score-value" id="player-score">0</strong></div>
				<div class="round-count">Round <span id="round-count">0</span></div>
				<div class="score"><span class="score-label">Computer</span><strong class="score-value" id="computer-score">0</strong></div>
			</div>
			<div class="duel" aria-label="Round choices">
				<div class="contestant">
					<span class="contestant-name">Your move</span>
					<div class="choice-display" id="player-display" aria-label="Your choice"><span>?</span></div>
				</div>
				<span class="versus" aria-hidden="true">VS</span>
				<div class="contestant">
					<span class="contestant-name">Computer</span>
					<div class="choice-display" id="computer-display" aria-label="Computer choice"><span>?</span></div>
				</div>
			</div>
			<div class="choices" aria-label="Choose rock, paper, or scissors">
				<button class="choice-button" type="button" data-choice="rock"><span class="choice-symbol" aria-hidden="true">✊</span><span class="choice-name">Rock</span></button>
				<button class="choice-button" type="button" data-choice="paper"><span class="choice-symbol" aria-hidden="true">✋</span><span class="choice-name">Paper</span></button>
				<button class="choice-button" type="button" data-choice="scissors"><span class="choice-symbol" aria-hidden="true">✌</span><span class="choice-name">Scissors</span></button>
			</div>
			<p class="status" id="game-status" role="status" aria-live="polite">Pick a move to play.</p>
			<div class="controls"><button class="reset" id="reset-button" type="button">Reset match</button></div>
		</section>
	</main>
	<script>
		const choices = ["rock", "paper", "scissors"];
		const symbols = { rock: "✊", paper: "✋", scissors: "✌" };
		const beats = { rock: "scissors", paper: "rock", scissors: "paper" };
		const choiceButtons = document.querySelectorAll(".choice-button");
		const playerDisplay = document.querySelector("#player-display");
		const computerDisplay = document.querySelector("#computer-display");
		const status = document.querySelector("#game-status");
		const playerScoreDisplay = document.querySelector("#player-score");
		const computerScoreDisplay = document.querySelector("#computer-score");
		const roundDisplay = document.querySelector("#round-count");
		let playerScore = 0;
		let computerScore = 0;
		let rounds = 0;
		let playing = false;

		function setChoice(display, choice, label) {
			display.innerHTML = `<span>${symbols[choice]}</span>`;
			display.setAttribute("aria-label", label);
			display.classList.remove("is-playing", "is-revealed");
			void display.offsetWidth;
			display.classList.add("is-revealed");
		}

		function playRound(playerChoice) {
			if (playing) return;
			playing = true;
			choiceButtons.forEach((button) => {
				button.disabled = true;
				button.classList.remove("is-playing");
				void button.offsetWidth;
				button.classList.add("is-playing");
			});
			playerDisplay.classList.add("is-playing");
			computerDisplay.classList.add("is-playing");
			status.textContent = "The computer is choosing...";

			window.setTimeout(() => {
				const computerChoice = choices[Math.floor(Math.random() * choices.length)];
				setChoice(playerDisplay, playerChoice, `Your choice: ${playerChoice}`);
				setChoice(computerDisplay, computerChoice, `Computer choice: ${computerChoice}`);
				rounds += 1;
				roundDisplay.textContent = rounds;

				if (playerChoice === computerChoice) {
					status.textContent = `A draw. You both chose ${playerChoice}.`;
				} else if (beats[playerChoice] === computerChoice) {
					playerScore += 1;
					status.textContent = `You win! ${playerChoice} beats ${computerChoice}.`;
				} else {
					computerScore += 1;
					status.textContent = `Computer wins. ${computerChoice} beats ${playerChoice}.`;
				}

				playerScoreDisplay.textContent = playerScore;
				computerScoreDisplay.textContent = computerScore;
				playing = false;
				choiceButtons.forEach((button) => {
					button.disabled = false;
					button.classList.remove("is-playing");
				});
			}, 550);
		}

		function resetMatch() {
			playerScore = 0;
			computerScore = 0;
			rounds = 0;
			playerScoreDisplay.textContent = "0";
			computerScoreDisplay.textContent = "0";
			roundDisplay.textContent = "0";
			playerDisplay.innerHTML = "<span>?</span>";
			computerDisplay.innerHTML = "<span>?</span>";
			playerDisplay.setAttribute("aria-label", "Your choice");
			computerDisplay.setAttribute("aria-label", "Computer choice");
			playerDisplay.classList.remove("is-playing", "is-revealed");
			computerDisplay.classList.remove("is-playing", "is-revealed");
			status.textContent = "Pick a move to play.";
		}

		choiceButtons.forEach((button) => {
			button.addEventListener("click", () => playRound(button.dataset.choice));
		});
		document.querySelector("#reset-button").addEventListener("click", resetMatch);
	</script>
</body>
</html>
