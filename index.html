<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Pick a quick game from the Common Ground game shelf.">
	<title>Common Ground | Games</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #20221f;
			--muted: #6c6f68;
			--paper: #f6f3ed;
			--cream: #fffdf8;
			--coral: #ed6f52;
			--coral-deep: #c94e39;
			--lime: #d8e889;
			--teal: #a9d0c0;
			--line: rgba(32, 34, 31, .14);
			--mono: "DM Mono", monospace;
			--sans: "Manrope", sans-serif;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: linear-gradient(rgba(32, 34, 31, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(32, 34, 31, .025) 1px, transparent 1px);
			background-size: 28px 28px;
			font-family: var(--sans);
			-webkit-font-smoothing: antialiased;
		}
		a { color: inherit; text-decoration: none; }
		.shell { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
		.nav { display: flex; align-items: center; justify-content: space-between; min-height: 82px; border-bottom: 1px solid var(--line); animation: arrive .55s ease both; }
		.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; }
		.brand-mark { width: 24px; height: 24px; border-radius: 50% 50% 50% 8px; background: var(--coral); transform: rotate(-18deg); }
		.nav-label { color: var(--muted); font-family: var(--mono); font-size: .68rem; text-transform: uppercase; }
		main { padding-top: 76px; padding-bottom: 70px; }
		.catalog-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
		.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--coral-deep); font-family: var(--mono); font-size: .68rem; text-transform: uppercase; }
		.eyebrow::before { width: 26px; height: 1px; background: currentColor; content: ""; }
		h1 { margin: 15px 0 0; font-size: 4.2rem; line-height: .98; letter-spacing: -.07em; font-weight: 800; }
		.catalog-index { padding-bottom: 5px; color: var(--muted); font-family: var(--mono); font-size: .68rem; text-transform: uppercase; }
		.game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
		.game-card { display: block; min-width: 0; overflow: hidden; border: 1px solid var(--line); background: var(--cream); transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; animation: arrive .6s ease both; }
		.game-card:nth-child(2) { animation-delay: .1s; }
		.game-card:hover { transform: translateY(-4px); border-color: rgba(32, 34, 31, .4); box-shadow: 0 12px 30px rgba(32, 34, 31, .08); }
		.game-card:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
		.game-art { position: relative; display: grid; min-height: 228px; overflow: hidden; place-items: center; }
		.game-art--number { background: var(--lime); }
		.game-art--hands { background: var(--teal); }
		.art-label { position: absolute; top: 20px; left: 22px; z-index: 1; color: var(--ink); font-family: var(--mono); font-size: .64rem; text-transform: uppercase; }
		.number-board { display: grid; grid-template-columns: repeat(3, 52px); gap: 8px; transform: rotate(-7deg); }
		.number-tile { display: grid; width: 52px; aspect-ratio: 1; place-items: center; border: 1px solid rgba(32, 34, 31, .35); background: rgba(255, 253, 248, .74); font-family: var(--mono); font-size: .86rem; }
		.number-tile:nth-child(2) { background: var(--coral); }
		.number-tile:nth-child(5) { color: var(--cream); background: var(--ink); font-size: 1.55rem; }
		.hand-set { display: flex; align-items: center; gap: 12px; transform: rotate(-5deg); }
		.hand-token { display: grid; width: 84px; aspect-ratio: 1; place-items: center; border: 1px solid var(--ink); border-radius: 50%; background: var(--cream); font-size: 2.5rem; }
		.hand-token:nth-child(2) { transform: translateY(-15px); background: var(--coral); }
		.hand-token:nth-child(3) { transform: translateY(8px); background: var(--lime); }
		.game-info { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 24px 24px; }
		.game-title { margin: 0 0 7px; font-size: 1.22rem; line-height: 1.2; }
		.game-meta { color: var(--muted); font-family: var(--mono); font-size: .64rem; text-transform: uppercase; }
		.game-arrow { display: grid; flex: 0 0 38px; width: 38px; aspect-ratio: 1; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-size: 1.05rem; transition: color .2s ease, background .2s ease, transform .2s ease; }
		.game-card:hover .game-arrow { transform: translateX(3px); border-color: var(--ink); color: var(--cream); background: var(--ink); }
		.footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: .62rem; text-transform: uppercase; }
		@keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 600px) {
			.shell { padding-right: 20px; padding-left: 20px; }
			.nav { min-height: 72px; }
			main { padding-top: 54px; }
			.catalog-heading { align-items: flex-start; flex-direction: column; gap: 16px; margin-bottom: 24px; }
			h1 { font-size: 3.1rem; }
			.game-art { min-height: 190px; }
			.game-info { padding: 19px 18px 20px; }
			.hand-token { width: 72px; font-size: 2.2rem; }
			.footer { flex-direction: column; margin-top: 34px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<header class="shell">
		<nav class="nav" aria-label="Main navigation">
			<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>common ground</a>
			<span class="nav-label">Game shelf</span>
		</nav>
	</header>

	<main class="shell">
		<section aria-labelledby="catalog-title">
			<div class="catalog-heading">
				<div>
					<div class="eyebrow">Common Ground arcade</div>
					<h1 id="catalog-title">Pick a game.</h1>
				</div>
				<span class="catalog-index">Choose your next round</span>
			</div>
			<div class="game-grid">
				<a class="game-card" href="number-guessing-game.html" aria-labelledby="number-game-title">
					<div class="game-art game-art--number" aria-hidden="true">
						<span class="art-label">Find the signal</span>
						<div class="number-board">
							<span class="number-tile">18</span><span class="number-tile">42</span><span class="number-tile">73</span>
							<span class="number-tile">09</span><span class="number-tile">?</span><span class="number-tile">88</span>
							<span class="number-tile">31</span><span class="number-tile">56</span><span class="number-tile">94</span>
						</div>
					</div>
					<div class="game-info">
						<div><h2 class="game-title" id="number-game-title">Number Guess</h2><span class="game-meta">Logic · solo</span></div>
						<span class="game-arrow" aria-hidden="true">&rarr;</span>
					</div>
				</a>
				<a class="game-card" href="rock-paper-scissors.html" aria-labelledby="rps-game-title">
					<div class="game-art game-art--hands" aria-hidden="true">
						<span class="art-label">Make your move</span>
						<div class="hand-set"><span class="hand-token">✊</span><span class="hand-token">✋</span><span class="hand-token">✌</span></div>
					</div>
					<div class="game-info">
						<div><h2 class="game-title" id="rps-game-title">Rock Paper Scissors</h2><span class="game-meta">Classic · vs computer</span></div>
						<span class="game-arrow" aria-hidden="true">&rarr;</span>
					</div>
				</a>
			</div>
		</section>
		<footer class="footer"><span>Common Ground</span><span>Games for a little downtime</span></footer>
	</main>
</body>
</html>
