<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Guess the hidden number in as few tries as you can.">
	<title>Number Game | Common Ground</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #20221f;
			--muted: #6c6f68;
			--paper: #f6f3ed;
			--cream: #fffdf8;
			--coral: #ed6f52;
			--coral-deep: #c94e39;
			--lime: #d8e889;
			--line: rgba(32, 34, 31, .14);
			--mono: "DM Mono", monospace;
			--sans: "Manrope", sans-serif;
		}

		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
		a { color: inherit; text-decoration: none; }
		button, input { font: inherit; }
		.shell { max-width: 1000px; margin: 0 auto; padding: 0 32px; }
		.nav { display: flex; align-items: center; justify-content: space-between; min-height: 88px; border-bottom: 1px solid var(--line); }
		.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; }
		.brand-mark { width: 24px; height: 24px; border-radius: 50% 50% 50% 8px; background: var(--coral); transform: rotate(-18deg); }
		.home-link { color: var(--muted); font-size: .82rem; font-weight: 700; }
		.home-link:hover { color: var(--ink); }
		main { display: grid; min-height: calc(100vh - 89px); place-items: center; padding-top: 42px; padding-bottom: 64px; }
		.game { width: min(100%, 560px); padding: 44px; border: 1px solid var(--line); background: var(--cream); animation: rise .6s ease both; }
		.eyebrow { color: var(--coral-deep); font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
		h1 { margin: 16px 0 12px; font-size: clamp(2.6rem, 8vw, 4rem); line-height: .98; letter-spacing: -.07em; }
		.intro { margin: 0; color: var(--muted); line-height: 1.65; }
		.range { display: flex; align-items: center; gap: 14px; margin: 30px 0; padding: 16px 18px; background: var(--lime); }
		.range strong { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; }
		.range span { color: #4f5543; font-size: .78rem; }
		label { display: block; margin-bottom: 9px; font-size: .82rem; font-weight: 700; }
		.entry { display: flex; gap: 10px; }
		input { width: 100%; min-width: 0; min-height: 50px; padding: 0 14px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); background: white; }
		input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		.button { min-height: 50px; padding: 0 20px; border: 1px solid var(--ink); border-radius: 2px; color: var(--cream); background: var(--ink); font-size: .82rem; font-weight: 700; cursor: pointer; transition: background .2s ease; }
		.button:hover { border-color: var(--coral-deep); background: var(--coral-deep); }
		.status { min-height: 28px; margin: 18px 0 10px; color: var(--coral-deep); font-size: .9rem; font-weight: 700; }
		.stats { display: flex; justify-content: space-between; gap: 12px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: .68rem; text-transform: uppercase; }
		.reset { margin-top: 24px; padding: 0; border: 0; border-bottom: 1px solid var(--ink); color: var(--ink); background: transparent; font-size: .8rem; font-weight: 700; cursor: pointer; }
		@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 560px) {
			.shell { padding-right: 20px; padding-left: 20px; }
			.nav { min-height: 72px; }
			.game { padding: 30px 22px; }
			.entry { flex-direction: column; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body>
	<header class="shell">
		<nav class="nav" aria-label="Main navigation">
			<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>common ground</a>
			<a class="home-link" href="index.html">Back to home</a>
		</nav>
	</header>
	<main class="shell">
		<section class="game" aria-labelledby="game-title">
			<div class="eyebrow">A little number puzzle</div>
			<h1 id="game-title">Find the hidden number.</h1>
			<p class="intro">I have a number in mind. Make a guess and I’ll tell you whether to go higher or lower.</p>
			<div class="range"><strong>1–100</strong><span>Your number is somewhere in this range.</span></div>
			<form id="guess-form">
				<label for="guess-input">Your guess</label>
				<div class="entry">
					<input id="guess-input" name="guess" type="number" min="1" max="100" step="1" placeholder="Enter a number" required autofocus>
					<button class="button" type="submit">Make a guess</button>
				</div>
			</form>
			<p class="status" id="game-status" role="status" aria-live="polite">Ready when you are.</p>
			<div class="stats"><span>Guesses: <strong id="guess-count">0</strong></span><span>Range: 1–100</span></div>
			<button class="reset" id="reset-button" type="button">Start a new game</button>
		</section>
	</main>
	<script>
		const form = document.querySelector("#guess-form");
		const input = document.querySelector("#guess-input");
		const status = document.querySelector("#game-status");
		const count = document.querySelector("#guess-count");
		const resetButton = document.querySelector("#reset-button");
		let answer;
		let guesses;
		let finished;

		function startGame() {
			answer = Math.floor(Math.random() * 100) + 1;
			guesses = 0;
			finished = false;
			count.textContent = guesses;
			status.textContent = "Ready when you are.";
			input.value = "";
			input.disabled = false;
			form.querySelector("button").disabled = false;
			input.focus();
		}

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const guess = Number(input.value);
			if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
				status.textContent = "Enter a whole number from 1 to 100.";
				return;
			}
			if (finished) return;

			guesses += 1;
			count.textContent = guesses;
			if (guess === answer) {
				status.textContent = `You got it in ${guesses} ${guesses === 1 ? "guess" : "guesses"}!`;
				finished = true;
				input.disabled = true;
				form.querySelector("button").disabled = true;
			} else {
				status.textContent = guess < answer ? "Too low. Try a higher number." : "Too high. Try a lower number.";
				input.select();
			}
		});

		resetButton.addEventListener("click", startGame);
		startGame();
	</script>
</body>
</html>
